                    <div class="w-36 shrink-0 truncate">
                        <span class="text-[8px] text-splat-yellow font-bold uppercase tracking-wider block leading-none">${w.category}</span>
                        <h2 class="text-[11px] font-black text-white truncate leading-tight mt-0.5">${w.name}</h2>
                    </div>
                    <div class="w-8 h-8 rounded bg-slate-950 flex items-center justify-center border border-slate-800 shrink-0 p-0.5">
                        <img src="${mainImgUrl}" alt="${w.name}" class="w-full h-full object-contain" onerror="this.src='https://splatoon3.ink/assets/favicon.ico'">
                    </div>
                    <div class="w-7 h-7 rounded bg-slate-950 flex items-center justify-center border border-slate-800 shrink-0 p-0.5">
                        <img src="${subImgUrl}" alt="${w.sub}" class="w-full h-full object-contain" onerror="this.style.display='none'">
                    </div>
                    <div class="w-7 h-7 rounded bg-slate-950 flex items-center justify-center border border-slate-800 shrink-0 p-0.5">
                        <img src="${spImgUrl}" alt="${w.sp}" class="w-full h-full object-contain" onerror="this.style.display='none'">
                    </div>
                    <div class="w-12 text-right shrink-0 text-[10px] text-slate-300 space-y-0.5 bg-slate-950/50 px-1 py-0.5 rounded border border-slate-800/60">
                        <div class="flex justify-between items-center px-0.5">
                            <span class="text-[8px] text-slate-400">射</span>
                            <span class="font-bold text-[10px]">${w.range}</span>
                        </div>
                        <div class="flex justify-between items-center px-0.5">
                            <span class="text-[8px] text-slate-400">ダ</span>
                            <span class="font-bold text-[10px]">${w.damage}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterWeapons() {
            const filtered = weaponsData.filter(w => {
                if (searchType === 'MAIN') {
                    return currentFilter === 'ALL' || w.category === currentFilter;
                } else if (searchType === 'SUB') {
                    return currentFilter === 'ALL' || w.subId === currentFilter;
                } else if (searchType === 'SPECIAL') {
                    return currentFilter === 'ALL' || w.spId === currentFilter;
                }
                return true;
            });
            renderWeapons(filtered);
        }

        window.onload = function() {
            renderFilterOptions();
            renderWeapons(weaponsData);
        };
    </script>
</body>
</html>
