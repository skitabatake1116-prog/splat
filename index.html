        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            if (!toast || !toastMsg) return;
            
            toastMsg.textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-10px]');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-10px]');
            }, 2000);

            const menu = document.getElementById('side-menu');
            const overlay = document.getElementById('side-menu-overlay');
            if (menu.classList.contains('open')) {
                menu.classList.remove('open');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            } else {
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                menu.classList.add('open');
            }
        }

        function openRatingInfoModal() {
            document.getElementById('rating-info-modal').classList.remove('hidden');
        }
        function closeRatingInfoModal() {
            document.getElementById('rating-info-modal').classList.add('hidden');
        }

        function getFormattedTimestamp() {
            const now = new Date();
            const yy = String(now.getFullYear()).slice(-2);
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            return `${yy}${mm}${dd}${hh}${min}`;
        }

        function exportRatingsCSV() {
            let csvRows = [];
            csvRows.push("WeaponIndex,WeaponName,Rule,Stage,Rating");

            for (let wIdx = 0; wIdx < weapons.length; wIdx++) {
                const wName = weapons[wIdx];
                if (!userRatings[wIdx]) continue;
                for (const [ruleKey, stagesObj] of Object.entries(userRatings[wIdx])) {
                    for (const [stageName, rating] of Object.entries(stagesObj)) {
                        csvRows.push(`${wIdx},"${wName}","${ruleKey}","${stageName}","${rating}"`);
                    }
                }
            }

            const csvString = csvRows.join("\n");
            const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvString], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const timestamp = getFormattedTimestamp();
            const fileName = `splat3_ratings_${timestamp}.csv`;

            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = url;
            downloadAnchor.setAttribute("download", fileName);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);
            URL.revokeObjectURL(url);
            showToast('評価をCSVで保存しました');
        }

        function importRatingsCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const text = e.target.result;
                    const lines = text.split("\n");
                    
                    let newRatings = {};

                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;

                        const parts = line.split(',');
                        if (parts.length >= 5) {
                            const wIdx = parseInt(parts[0].trim());
                            const rule = parts[2].trim().replace(/"/g, '');
                            const stage = parts[3].trim().replace(/"/g, '');
                            const rating = parts[4].trim().replace(/"/g, '');

                            if (!isNaN(wIdx)) {
                                if (!newRatings[wIdx]) newRatings[wIdx] = {};
                                if (!newRatings[wIdx][rule]) newRatings[wIdx][rule] = {};
                                newRatings[wIdx][rule][stage] = rating;
                            }
                        }
                    }

                    if (Object.keys(newRatings).length > 0) {
                        userRatings = newRatings;
                        saveRatingsToStorage();
                        renderSettingsStageList();
                        renderSchedules();
                        showToast('CSVから評価を復元しました！');
                    } else {
                        alert('有効なデータが見つかりませんでした。');
                    }
                } catch (err) {
                    alert('CSVファイルの読み込みに失敗しました。');
                }
            };
            reader.readAsText(file, "UTF-8");
        }

        function initRatings() {
            let updated = false;
            for (let wIdx = 0; wIdx < 5; wIdx++) {
                if (!userRatings[wIdx]) {
                    userRatings[wIdx] = {};
                    updated = true;
                }
                Object.keys(RULES).forEach(rule => {
                    if (!userRatings[wIdx][rule]) {
                        userRatings[wIdx][rule] = {};
                        updated = true;
                    }
                    STAGES.forEach(stg => {
                        if (!userRatings[wIdx][rule][stg.name]) {
                            userRatings[wIdx][rule][stg.name] = 'B';
                            updated = true;
                        }
                    });
                });
            }
            if (updated) {
                saveRatingsToStorage();
            }
        }

        function saveRatingsToStorage() {
            localStorage.setItem('splat3_xmatch_weapon_ratings', JSON.stringify(userRatings));
        }

        function renderWeaponTabs() {
            const container = document.getElementById('weapon-tabs-container');
            container.innerHTML = '';

            weapons.forEach((wName, idx) => {
                const isSelected = idx === selectedWeaponIndex;
                const btn = document.createElement('button');
                btn.onclick = () => selectActiveWeapon(idx);
                btn.className = `py-2 px-1 rounded-xl text-xs font-bold truncate transition-all flex flex-col items-center gap-0.5 ${
                    isSelected 
                        ? 'bg-splat-yellow text-slate-950 shadow-md ring-2 ring-splat-yellow/50 scale-[1.02]' 
                        : 'bg-slate-800/80 text-slate-400 hover:text-slate-200'
                }`;
                btn.innerHTML = `
                    <span class="text-[9px] opacity-70">W${idx + 1}</span>
                    <span class="w-full truncate">${wName || '未登録'}</span>
                `;
                container.appendChild(btn);
            });
        }

        function selectActiveWeapon(idx) {
            selectedWeaponIndex = idx;
            localStorage.setItem('splat3_selected_weapon_idx', idx.toString());
            renderWeaponTabs();
            renderSchedules();
        }

        function formatIsoTime(isoStr) {
            if (!isoStr) return '';
            const date = new Date(isoStr);
            const h = date.getHours().toString().padStart(2, '0');
            const m = date.getMinutes().toString().padStart(2, '0');
            return `${h}:${m}`;
        }

        function translateStageName(rawName) {
            if (!rawName) return '';
            return STAGE_TRANSLATIONS[rawName] || rawName;
        }

        async function fetchAllSchedules() {
            const icon = document.getElementById('refresh-icon');
            if (icon) icon.classList.add('fa-spin');

            // 1. Xマッチスケジュールの取得
            try {
                const res = await fetch('https://spla3.yuu26.com/api/x');
                if (!res.ok) throw new Error('spla3 x api failed');
                const json = await res.json();
                
                const results = json.results || [];
                if (results.length > 0) {
                    schedulesList = results.slice(0, 3).map((match, idx) => {
                        const ruleName = match.rule?.name || 'ガチエリア';
                        const stages = (match.stages || []).map(stg => {
                            const translatedName = stg.name;
                            const foundMeta = STAGES.find(s => s.name === translatedName);
                            return {
                                name: translatedName,
                                image: stg.image || foundMeta?.img || ''
                            };
                        });

                        let label = '現在開催中';
                        if (idx === 1) label = '次のスケジュール';
                        if (idx === 2) label = '次の次のスケジュール';

                        return {
                            isCurrent: idx === 0,
                            label: label,
                            ruleName: ruleName,
                            stages: stages,
                            startTime: formatIsoTime(match.start_time),
                            endTime: formatIsoTime(match.end_time)
                        };
                    });
                }
            } catch (err) {
                console.warn('Spla3 X API error, trying fallback', err);
                try {
                    const resInk = await fetch('https://splatoon3.ink/data/schedules.json');
                    const jsonInk = await resInk.json();
                    const xSchedules = jsonInk.data?.xSchedules?.nodes || [];
                    if (xSchedules.length > 0) {
                        schedulesList = xSchedules.slice(0, 3).map((match, idx) => {
                            const settings = match.xMatchSetting;
                            const ruleRaw = settings?.vsRule?.name || 'Splat Zones';
                            const ruleName = RULE_TRANSLATIONS[ruleRaw] || 'ガチエリア';
                            const stages = (settings?.vsStages || []).map(stg => {
                                const translatedName = translateStageName(stg.name);
                                const foundMeta = STAGES.find(s => s.name === translatedName);
                                return { name: translatedName, image: foundMeta?.img || '' };
                            });
                            let label = '現在開催中';
                            if (idx === 1) label = '次のスケジュール';
                            if (idx === 2) label = '次の次のスケジュール';
                            return {
                                isCurrent: idx === 0,
                                label: label,
                                ruleName: ruleName,
                                stages: stages,
                                startTime: formatIsoTime(match.startTime),
                                endTime: formatIsoTime(match.endTime)
                            };
                        });
                    }
                } catch (e) {
                    console.error('All X schedules failed', e);
                }
            }

            // 2. サーモンラン情報の取得
            try {
                const resCoop = await fetch('https://spla3.yuu26.com/api/coop-grouping/now');
                if (resCoop.ok) {
                    const coopJson = await resCoop.json();
                    const results = coopJson.results || [];
                    if (results.length > 0) {
                        const cur = results[0];
                        const setting = cur.setting || cur;
                        const stage = setting.stage || {};
                        const weapons = (setting.weapons || []).map(w => ({
                            name: w.name || '',
                            image: w.image || ''
                        }));

                        const formatCoopTime = (iso) => {
                            if (!iso) return '';
                            const d = new Date(iso);
                            return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                        };

                        coopSchedule = {
                            label: 'サーモンラン・オープン',
                            startTime: formatCoopTime(cur.start_time),
                            endTime: formatCoopTime(cur.end_time),
                            stageName: stage.name || 'アラマキ砦',
                            stageImg: stage.image || '',
                            weapons: weapons
                        };
                    }
                }
            } catch (err) {
                console.warn('Spla3 Coop API error', err);
            }

            renderSchedules();
            if (icon) icon.classList.remove('fa-spin');
        }

        function renderStageCard(stageName, directApiImage, rating, ratingBadgeColor) {
            return `
                <div class="w-full h-32 rounded-2xl relative overflow-hidden bg-slate-900 border border-slate-800 shadow-lg">
                    <img src="${directApiImage}" alt="" 
                         onerror="this.parentElement.innerHTML='<div class=\'w-full h-32 rounded-2xl bg-gradient-to-br from-slate-800 to-slate-950 flex items-center justify-center relative\'><span class=\'text-white font-black text-xs\'>${stageName}</span></div>';"
                         class="w-full h-full object-cover brightness-95" />
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-transparent to-transparent pointer-events-none"></div>
                    <div class="absolute bottom-2 left-2 z-20 pointer-events-none pr-2">
                        <span class="text-white font-black text-xs sm:text-sm drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] tracking-tight block truncate">${stageName}</span>
                    </div>
                    <div class="absolute top-2 right-2 z-20 flex items-center gap-1 bg-slate-950/85 backdrop-blur-md px-1.5 py-0.5 rounded-lg border border-white/15 shadow-xl pointer-events-none">
                        <span class="text-[9px] text-slate-300 font-bold">評価</span>
                        <span class="w-6 h-6 rounded-md ${ratingBadgeColor} flex items-center justify-center font-black text-xs shadow">${rating}</span>
                    </div>
                </div>
            `;
        }

        function getRuleKeyByName(name) {
            for (let [key, val] of Object.entries(RULES)) {
                if (val === name) return key;
            }
            return 'AREA';
        }

        function renderSchedules() {
            const listContainer = document.getElementById('current-schedules-list');
            listContainer.innerHTML = '';

            // 1. サーモンランのカードを挿入（「支給武器」文言を削除）
            if (coopSchedule) {
                let weaponsHtml = '';
                coopSchedule.weapons.forEach(w => {
                    weaponsHtml += `
                        <div class="w-8 h-8 rounded-lg bg-slate-950/80 border border-slate-700/60 flex items-center justify-center p-0.5 shadow" title="${w.name}">
                            <img src="${w.image}" alt="${w.name}" class="w-full h-full object-contain" onerror="this.style.display='none'">
                        </div>
                    `;
                });

                const coopCard = document.createElement('div');
                coopCard.className = "space-y-2 p-3 rounded-3xl bg-slate-900/90 border border-slate-800 shadow-xl";
                coopCard.innerHTML = `
                    <div class="flex justify-between items-center px-1">
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-salmon-orange text-white">開催中</span>
                            <span class="text-xs font-black tracking-wider uppercase px-2.5 py-0.5 rounded-lg bg-orange-600 text-white shadow-sm">
                                ${coopSchedule.label}
                            </span>
                        </div>
                        <div class="text-[10px] text-slate-400 font-medium">
                            <span class="font-bold text-slate-200">${coopSchedule.startTime} ~ ${coopSchedule.endTime}</span>
                        </div>
                    </div>
                    <!-- ステージと支給武器の表示エリア -->
                    <div class="grid grid-cols-1 gap-2">
                        <div class="w-full h-32 rounded-2xl relative overflow-hidden bg-slate-900 border border-slate-800 shadow-lg">
                            <img src="${coopSchedule.stageImg}" alt="" class="w-full h-full object-cover brightness-95" onerror="this.style.display='none'" />
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-transparent to-transparent pointer-events-none"></div>
                            <div class="absolute bottom-2 left-2 z-20 pointer-events-none pr-2">
                                <span class="text-white font-black text-sm drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] tracking-tight block">${coopSchedule.stageName}</span>
                            </div>
                            <!-- 支給武器欄（「支給武器」文言削除） -->
                            <div class="absolute top-2 right-2 z-20 flex items-center gap-1.5 bg-slate-950/40 backdrop-blur-md px-2 py-1 rounded-xl border border-white/20 shadow-xl">
                                ${weaponsHtml}
                            </div>
                        </div>
                    </div>
                `;
                listContainer.appendChild(coopCard);
            }

            // 2. Xマッチスケジュールのカードを描画
            schedulesList.forEach((sch) => {
                const ruleKey = getRuleKeyByName(sch.ruleName);
                const activeWeaponRatings = (userRatings[selectedWeaponIndex] && userRatings[selectedWeaponIndex][ruleKey]) ? userRatings[selectedWeaponIndex][ruleKey] : {};

                let stageCardsHtml = '';
                sch.stages.forEach(stg => {
                    const stgName = translateStageName(stg.name);
                    const rating = activeWeaponRatings[stgName] || 'B';
                    const ratingBadgeColor = RATING_COLORS[rating] || 'bg-slate-700';

                    stageCardsHtml += `
                        <div>
                            ${renderStageCard(stgName, stg.image, rating, ratingBadgeColor)}
                        </div>
                    `;
                });

                const card = document.createElement('div');
                card.className = `space-y-2 p-3 rounded-3xl ${sch.isCurrent ? 'bg-slate-900/90 border border-slate-800 shadow-xl' : 'bg-slate-950/50 border border-slate-800/60 opacity-90'}`;
                card.innerHTML = `
                    <div class="flex justify-between items-center px-1">
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${sch.isCurrent ? 'bg-splat-yellow text-slate-950' : 'bg-slate-800 text-slate-400'}">${sch.label}</span>
                            <span class="text-xs font-black tracking-wider uppercase px-2.5 py-0.5 rounded-lg bg-splat-purple text-white shadow-sm">
                                ${sch.ruleName}
                            </span>
                        </div>
                        <div class="text-[10px] text-slate-400 font-medium">
                            <span class="font-bold text-slate-200">${sch.startTime} ~ ${sch.endTime}</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        ${stageCardsHtml}
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function openWeaponManagerModal() {
            const list = document.getElementById('weapon-inputs-list');
            list.innerHTML = '';

            for (let i = 0; i < 5; i++) {
                const val = weapons[i] || '';
                const item = document.createElement('div');
                item.className = "flex items-center gap-2";
                item.innerHTML = `
                    <span class="text-xs font-bold text-slate-400 w-8">W${i + 1}</span>
                    <input type="text" id="weapon-input-${i}" value="${val}" placeholder="ブキ名を入力 (例: スプラシューター)" 
                        class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-splat-yellow">
                `;
                list.appendChild(item);
            }

            document.getElementById('weapon-modal').classList.remove('hidden');
        }

        function closeWeaponManagerModal() {
            document.getElementById('weapon-modal').classList.add('hidden');
        }

        function saveWeapons() {
            for (let i = 0; i < 5; i++) {
                const input = document.getElementById(`weapon-input-${i}`);
                if (input) {
                    weapons[i] = input.value.trim() || `ブキ${i + 1}`;
                }
            }
            localStorage.setItem('splat3_xmatch_weapons', JSON.stringify(weapons));
            closeWeaponManagerModal();
            renderWeaponTabs();
            renderSchedules();
            showToast('ブキ設定を保存しました');
        }

        function openSettingsModal() {
            selectedSettingsWeaponIdx = selectedWeaponIndex;
            renderSettingsWeaponTabs();
            document.getElementById('settings-modal').classList.remove('hidden');
            renderSettingsStageList();
        }

        function closeSettingsModal() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function renderSettingsWeaponTabs() {
            const container = document.getElementById('settings-weapon-tabs');
            container.innerHTML = '';

            weapons.forEach((wName, idx) => {
                const isSelected = idx === selectedSettingsWeaponIdx;
                const btn = document.createElement('button');
                btn.onclick = () => {
                    selectedSettingsWeaponIdx = idx;
                    renderSettingsWeaponTabs();
                    renderSettingsStageList();
                };
                btn.className = `py-1.5 px-1 rounded-lg text-[10px] font-bold truncate transition ${
                    isSelected ? 'bg-splat-yellow text-slate-950 font-black' : 'text-slate-400 hover:text-slate-200'
                }`;
                btn.textContent = wName || `W${idx + 1}`;
                container.appendChild(btn);
            });
        }

        function selectSettingsRule(ruleKey) {
            selectedSettingsRule = ruleKey;
            
            document.querySelectorAll('#rule-selector-buttons button').forEach(btn => {
                if (btn.dataset.rule === ruleKey) {
                    btn.className = "rule-btn py-1.5 text-xs font-bold rounded-lg bg-splat-yellow text-slate-900";
                } else {
                    btn.className = "rule-btn py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-slate-300";
                }
            });

            renderSettingsStageList();
        }

        function getSettingsStageImageHtml(stageMeta, stageName) {
            const colorGradient = stageMeta?.color || 'from-slate-800 to-slate-950';
            const targetUrl = stageMeta?.img || '';

            return `
                <div class="w-full h-20 rounded-xl relative overflow-hidden bg-slate-900 border border-slate-800 shadow-lg">
                    <img src="${targetUrl}" alt="" 
                         onerror="this.parentElement.innerHTML='<div class=\'w-full h-20 rounded-xl bg-gradient-to-br ${colorGradient} flex items-end p-2 relative overflow-hidden\'><div class=\'absolute bottom-1.5 left-2 z-20 pr-3\'><span class=\'text-white font-black text-xs drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] block truncate\'>${stageName}</span></div></div>';"
                         class="w-full h-full object-cover brightness-95" />
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/85 via-slate-950/20 to-transparent pointer-events-none"></div>
                    <div class="absolute bottom-1.5 left-2 z-20 pointer-events-none pr-3">
                        <span class="text-white font-black text-xs drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] tracking-wide block truncate">${stageName}</span>
                    </div>
                </div>
            `;
        }

        function renderSettingsStageList() {
            const list = document.getElementById('stage-rating-list');
            list.innerHTML = '';

            const activeWeaponRatings = (userRatings[selectedSettingsWeaponIdx] && userRatings[selectedSettingsWeaponIdx][selectedSettingsRule]) ? userRatings[selectedSettingsWeaponIdx][selectedSettingsRule] : {};

    STAGES.forEach(stg => {
                const currentRating = activeWeaponRatings[stg.name] || 'B';
                const row = document.createElement('div');
                row.className = "p-2.5 rounded-xl bg-slate-800/90 border border-slate-700/80 space-y-2 shadow-lg";
                
                const stageBannerHtml = getSettingsStageImageHtml(stg, stg.name);

                row.innerHTML = `
                    <div class="relative">
                        ${stageBannerHtml}
                    </div>
                    <div class="flex justify-between gap-1 pt-0.5">
                        ${['S', 'A', 'B', 'C', 'D'].map(tier => `
                            <button onclick="setStageRating(${selectedSettingsWeaponIdx}, '${selectedSettingsRule}', '${stg.name}', '${tier}')" 
                                class="tier-btn-${stg.name}-${tier} flex-1 py-1.5 rounded-lg text-xs font-black transition ${currentRating === tier ? (RATING_COLORS[tier] + ' ring-2 ring-white scale-105 shadow-md') : 'bg-slate-700/80 text-slate-300 hover:bg-slate-600'}">
                                ${tier}
                            </button>
                        `).join('')}
                    </div>
                `;
                list.appendChild(row);
            });
        }

        function setStageRating(wIdx, rule, stageName, tier) {
            if (!userRatings[wIdx]) userRatings[wIdx] = {};
            if (!userRatings[wIdx][rule]) userRatings[wIdx][rule] = {};
            userRatings[wIdx][rule][stageName] = tier;
            
            saveRatingsToStorage();

            ['S', 'A', 'B', 'C', 'D'].forEach(t => {
                const btn = document.querySelector(`.tier-btn-${stageName}-${t}`);
                if (btn) {
                    if (t === tier) {
                        btn.className = `tier-btn-${stageName}-${t} flex-1 py-1.5 rounded-lg text-xs font-black transition ${RATING_COLORS[t]} ring-2 ring-white scale-105 shadow-md`;
                    } else {
                        btn.className = `tier-btn-${stageName}-${t} flex-1 py-1.5 rounded-lg text-xs font-black transition bg-slate-700/80 text-slate-300 hover:bg-slate-600`;
                    }
                }
            });

            renderSchedules();
            showToast('評価を保存しました');
        }

        window.onload = function() {
            initRatings();
            renderWeaponTabs();
            fetchAllSchedules();
        };
    </script>
</body>
