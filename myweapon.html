<!DOCTYPE html>
<html lang="ja">

    <meta charset="UTF-8">

        body {

            color: #f8fafc;
        }
        .bg-splat-yellow { background-color: #eaff3d; }
        .text-splat-yellow { color: #eaff3d; }
        .glass-card {
            background: rgba(26, 35, 50, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        #side-menu {
            transition: transform 0.3s ease-in-out;
            transform: translateX(100%);
        }
        #side-menu.open {
            transform: translateX(0);
        }
    </style>
</head>

    <!-- Header -->

        </div>

        </nav>
    </div>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-3 space-y-4">

        <!-- CSV Backup / Restore Section -->
        <div class="glass-card rounded-2xl p-3 space-y-2">
            <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">マイコーデのバックアップ</span>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="exportCSV()" class="py-2 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700 flex items-center justify-center gap-1.5 transition">
                    <i class="fa-solid fa-file-csv text-splat-yellow"></i> CSV保存
                </button>
                <label class="py-2 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700 flex items-center justify-center gap-1.5 transition cursor-pointer">
                    <i class="fa-solid fa-upload text-splat-yellow"></i> CSV読込
                    <input type="file" id="import-file" accept=".csv,.txt" onchange="importCSV(event)" class="hidden">
                </label>
            </div>
        </div>

        <!-- 6 Tabs for Sets -->
        <div class="grid grid-cols-6 gap-1 bg-slate-900 p-1 rounded-2xl border border-slate-800" id="set-tabs-container">
            <!-- Dynamic Set Tabs (1~6) -->
        </div>

        <!-- Weapon Selector Card -->

            <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">ブキ選択</span>

                <div class="flex items-center flex-1">
                    <select id="weapon-select" onchange="onWeaponChange()" class="w-full bg-transparent text-xs font-black text-white focus:outline-none cursor-pointer whitespace-normal leading-relaxed h-12">
                        <!-- Dynamic weapon options -->
                    </select>
                </div>
                <div class="flex items-center gap-1.5 shrink-0 bg-slate-900 p-1.5 rounded-2xl border border-slate-800">
                    <div class="w-12 h-12 rounded-xl bg-slate-950 flex items-center justify-center border border-slate-800 p-1">
                        <img id="selected-main-icon" src="https://splatoon3.ink/assets/favicon.ico" class="w-full h-full object-contain" alt="">
                    </div>
                    <div class="w-11 h-11 rounded-xl bg-slate-950 flex items-center justify-center border border-slate-800 p-1">
                        <img id="selected-sub-icon" src="" class="w-full h-full object-contain" alt="" onerror="this.style.display='none'">
                    </div>
                    <div class="w-11 h-11 rounded-xl bg-slate-950 flex items-center justify-center border border-slate-800 p-1">
                        <img id="selected-sp-icon" src="" class="w-full h-full object-contain" alt="" onerror="this.style.display='none'">

                </div>
            </div>
        </div>

        </div>

                <!-- 動的生成 -->
            </div>
        </div>

        function showToast(msg) {
            const toast = document.getElementById('toast');

            if (!toast || !toastMsg) return;
            toastMsg.textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-10px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-10px]');
            }, 2000);

        function toggleSideMenu() {
            const menu = document.getElementById('side-menu');
            const overlay = document.getElementById('side-menu-overlay');
            if (menu.classList.contains('open')) {
                menu.classList.remove('open');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            } else {
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                menu.classList.add('open');
            }

        function assignPower(powerId) {
            if (!activePowerSlot) {
                activePowerSlot = { part: 'head', type: 'main', index: 0 };
            }

            const { part, type, index } = activePowerSlot;
            const powerObj = GEAR_POWERS.find(gp => gp.id === powerId);
            if (!powerObj) return;

            if (powerObj.type === 'head_main' && (part !== 'head' || type !== 'main')) return;
            if (powerObj.type === 'clothes_main' && (part !== 'clothes' || type !== 'main')) return;
            if (powerObj.type === 'shoes_main' && (part !== 'shoes' || type !== 'main')) return;
            if (powerObj.type !== 'any' && type === 'sub') return;

            const target = mySets[currentSetIndex][part];
            if (type === 'main') {
                target.main = powerId;
            } else {
                target.subs[index] = powerId;
            }

            saveToStorage();
            renderGearParts();
        }

        function dropPower(event, part, type, index) {
            event.preventDefault();
            const powerId = event.dataTransfer.getData('text/plain');
            if (!powerId) return;

            const powerObj = GEAR_POWERS.find(gp => gp.id === powerId);
            if (!powerObj) return;

            if (powerObj.type === 'head_main' && (part !== 'head' || type !== 'main')) return;
            if (powerObj.type === 'clothes_main' && (part !== 'clothes' || type !== 'main')) return;
            if (powerObj.type === 'shoes_main' && (part !== 'shoes' || type !== 'main')) return;
            if (powerObj.type !== 'any' && type === 'sub') return;

            const target = mySets[currentSetIndex][part];
            if (type === 'main') {
                target.main = powerId;
            } else {
                target.subs[index] = powerId;
            }

            saveToStorage();
            renderGearParts();
        }

            if (type === 'main') {
                target.main = "";

                target.subs[index] = "";

            saveToStorage();
            renderGearParts();
        }

        function getFormattedTimestamp() {
            const now = new Date();
            const yy = String(now.getFullYear()).slice(-2);
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            return `${yy}${mm}${dd}${hh}${min}`;
        }

        function exportCSV() {
            let csvRows = ["SetIndex,Weapon,Part,SlotType,SlotIndex,PowerId"];
            mySets.forEach((set, sIdx) => {
                ['head', 'clothes', 'shoes'].forEach(part => {
                    csvRows.push(`${sIdx},"${set.weapon}","${part}","main",0,"${set[part].main}"`);
                    set[part].subs.forEach((sub, subIdx) => {
                        csvRows.push(`${sIdx},"${set.weapon}","${part}","sub",${subIdx},"${sub}"`);
                    });
                });
            });

            const csvString = csvRows.join("\n");
            const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvString], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const timestamp = getFormattedTimestamp();
            const fileName = `splat3_my_gears_${timestamp}.csv`;

            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = url;
            downloadAnchor.setAttribute("download", fileName);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);
            URL.revokeObjectURL(url);
            showToast('マイコーデをCSVで保存しました');
        }

        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const lines = e.target.result.split("\n");
                    let newSets = JSON.parse(JSON.stringify(mySets));

                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;
                        const parts = line.split(',');
                        const sIdx = parseInt(parts[0].trim());
                        const weapon = parts[1].trim().replace(/"/g, '');
                        const part = parts[2].trim().replace(/"/g, '');
                        const slotType = parts[3].trim().replace(/"/g, '');
                        const slotIndex = parseInt(parts[4].trim());
                        const powerId = parts[5].trim().replace(/"/g, '');

                        if (!isNaN(sIdx) && newSets[sIdx]) {
                            newSets[sIdx].weapon = weapon;
                            if (slotType === 'main') {
                                newSets[sIdx][part].main = powerId;
                            } else {
                                newSets[sIdx][part].subs[slotIndex] = powerId;
                            }
                        }
                    }
                    mySets = newSets;
                    saveToStorage();
                    renderAll();
                    showToast('CSVからマイコーデを復元しました！');
                } catch (err) {
                    alert('CSVファイルの読み込みに失敗しました。');
                }
            };
            reader.readAsText(file, "UTF-8");
        }

        window.onload = function() {
            renderAll();
        };
    </script>
</body>
</html>
